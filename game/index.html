<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Verde — Streets of the Sun</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1018; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #err { position: fixed; left: 8px; bottom: 8px; max-width: 90%; color: #ffb3b3; background: rgba(0,0,0,0.7); font: 12px monospace; padding: 4px 8px; display: none; z-index: 9; }
</style>
</head>
<body>
<canvas id="game" aria-label="Costa Verde: an open-world crime game. Walk the city, steal cars, lose the cops, finish the missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="err"></div>
<script>
  // Surface any boot error as page text, so a headless check can see it.
  window.addEventListener('error', function (event) {
    var box = document.getElementById('err');
    if (box) {
      box.style.display = 'block';
      box.textContent = 'ERROR: ' + (event.message || event.error);
    }
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
